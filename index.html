            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    userAnswers = JSON.parse(saved);
                } catch(e) {
                    userAnswers = {};
                }
            }
        }

        function saveAnswers() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userAnswers));
            const statusEl = document.getElementById('save-status');
            statusEl.textContent = '🟢 Tersimpan Otomatis';
            statusEl.className = 'text-emerald-300 transition-all';
        }

        // SVG Renderer for Stacked Cubes (Presisi Isometrik Lembar Kerja)
        function generateCubesSVG(structure) {
            // Urutkan kubus dari paling belakang ke paling depan agar layering SVG pas
            const sorted = [...structure].sort((a, b) => {
                if (a.z !== b.z) return a.z - b.z; // Dari bawah ke atas
                if ((a.x + a.y) !== (b.x + b.y)) return (a.x + a.y) - (b.x + b.y); // Dari belakang ke depan
                return a.x - b.x;
            });

            // Hitung bounds untuk pengetengahan visual otomatis
            let minIsoX = Infinity, maxIsoX = -Infinity;
            let minIsoY = Infinity, maxIsoY = -Infinity;

            const unitW = 20; // Setengah lebar kubus
            const unitH = 10; // Setengah tinggi proyeksi atas
            const cubeH = 22; // Tinggi tegak lurus kubus

            sorted.forEach(c => {
                const ix = (c.x - c.y) * unitW;
                const iy = (c.x + c.y) * unitH - (c.z * cubeH);
                if (ix < minIsoX) minIsoX = ix;
                if (ix > maxIsoX) maxIsoX = ix;
                if (iy < minIsoY) minIsoY = iy;
                if (iy > maxIsoY) maxIsoY = iy;
            });

            const originX = 125 - (minIsoX + maxIsoX) / 2;
            const originY = 100 - (minIsoY + maxIsoY) / 2 + 10;

            let svgContent = '';

            sorted.forEach(c => {
                const px = originX + (c.x - c.y) * unitW;
                const py = originY + (c.x + c.y) * unitH - (c.z * cubeH);

                // Poligon 3 Sisi Kubus Satuan
                const topFace = `${px},${py - cubeH} ${px + unitW},${py - cubeH + unitH} ${px},${py - cubeH + 2 * unitH} ${px - unitW},${py - cubeH + unitH}`;
                const leftFace = `${px - unitW},${py - cubeH + unitH} ${px},${py - cubeH + 2 * unitH} ${px},${py + 2 * unitH} ${px - unitW},${py + unitH}`;
                const rightFace = `${px},${py - cubeH + 2 * unitH} ${px + unitW},${py - cubeH + unitH} ${px + unitW},${py + unitH} ${px},${py + 2 * unitH}`;

                svgContent += `
                    <g class="cube-group">
                        <!-- Top Face (Pink) -->
                        <polygon points="${topFace}" fill="#ff758f" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
                        <!-- Left Face (Yellow/Orange) -->
                        <polygon points="${leftFace}" fill="#ffb703" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
                        <!-- Right Face (Blue) -->
                        <polygon points="${rightFace}" fill="#4ea8de" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
                    </g>
                `;
            });

            return `
                <svg width="220" height="190" viewBox="0 0 250 200" class="isometric-svg mx-auto">
                    ${svgContent}
                </svg>
            `;
        }

        // Render Nav Grid Buttons
        function renderNavGrid() {
            const navGrid = document.getElementById('nav-grid');
            navGrid.innerHTML = '';

            currentFilterList.forEach(q => {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${q.id}`;
                btn.onclick = () => showQuestion(q.id);
                
                const isAnswered = userAnswers[q.id] !== undefined;
                let bgClass = 'bg-slate-100 text-slate-700 border-slate-200';
                
                if (isAnswered) {
                    if (userAnswers[q.id].isCorrect) {
                        bgClass = 'bg-emerald-500 text-white border-emerald-600 font-bold';
                    } else {
                        bgClass = 'bg-rose-500 text-white border-rose-600 font-bold';
                    }
                }

                if (q.id === activeQuestionId) {
                    bgClass += ' ring-2 ring-indigo-600 ring-offset-2';
                }

                btn.className = `w-9 h-9 text-xs rounded-xl border flex items-center justify-center transition-all ${bgClass} hover:scale-105`;
                btn.textContent = q.id;
                navGrid.appendChild(btn);
            });
        }

        // Render Question Cards
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            currentFilterList.forEach(q => {
                const card = document.createElement('div');
                card.id = `q-card-${q.id}`;
                const isActive = q.id === activeQuestionId;
                card.className = `q-card-step ${isActive ? 'active' : ''} bg-white rounded-2xl p-5 md:p-7 shadow-sm border border-slate-200 transition-all`;

                let visualHTML = '';
                if (q.type === 'cubes') {
                    visualHTML = `
                        <div class="bg-amber-500/5 p-4 rounded-xl border border-slate-900/10 mb-4 flex justify-center">
                            ${generateCubesSVG(q.structure)}
                        </div>
                    `;
                }

                const savedData = userAnswers[q.id] || { text: '', isCorrect: null };
                
                let feedbackHTML = '';
                if (savedData.isCorrect !== null) {
                    if (savedData.isCorrect) {
                        feedbackHTML = `<div class="mt-3 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-bold text-emerald-700 flex items-center gap-2">🎉 Jawaban Kamu BENAR! Sangat Hebat!</div>`;
                    } else {
                        feedbackHTML = `<div class="mt-3 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs font-bold text-rose-700 flex items-center gap-2">❌ Jawaban Belum Tepat. Coba periksa kembali ya!</div>`;
                    }
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="inline-block bg-slate-900 text-white text-xs font-bold px-3 py-1 rounded-full">Soal #${q.id}</span>
                    </div>

                    <h3 class="font-bold text-slate-900 text-base md:text-lg mb-2">${q.title}</h3>
                    <p class="text-slate-600 text-xs md:text-sm leading-relaxed mb-4">${q.desc}</p>

                    ${visualHTML}

                    <!-- Input Section -->
                    <div class="space-y-2 pt-2 border-t border-slate-100">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Jawaban Kamu:</label>
                        <div class="flex flex-wrap items-center gap-2">
                            <input type="text" id="input-${q.id}" value="${savedData.text}" placeholder="Tulis jawaban..." 
                                class="flex-grow max-w-md px-4 py-2.5 text-sm md:text-base font-semibold border-2 border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white">
                            ${q.unitLabel ? `<span class="font-bold text-slate-700 text-sm">${q.unitLabel}</span>` : ''}
                            <button onclick="checkAnswer(${q.id})" class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition-all shadow-sm">
                                Periksa Jawaban
                            </button>
                        </div>
                        <div id="feedback-${q.id}">${feedbackHTML}</div>
                    </div>
                `;

                container.appendChild(card);
            });

            updateNavigationState();
            updateScoreUI();
        }

        // Show Single Question Step
        function showQuestion(qId) {
            activeQuestionId = qId;
            document.querySelectorAll('.q-card-step').forEach(card => card.classList.remove('active'));
            const activeCard = document.getElementById(`q-card-${qId}`);
            if (activeCard) activeCard.classList.add('active');
            
            renderNavGrid();
            updateNavigationState();
        }

        function updateNavigationState() {
            const currentIndex = currentFilterList.findIndex(q => q.id === activeQuestionId);
            const prevBtn = document.getElementById('btn-prev');
            const nextBtn = document.getElementById('btn-next');
            const indicator = document.getElementById('question-progress-indicator');

            if (currentIndex <= 0) {
                prevBtn.disabled = true;
                prevBtn.classList.add('opacity-40', 'cursor-not-allowed');
            } else {
                prevBtn.disabled = false;
                prevBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            }

            if (currentIndex >= currentFilterList.length - 1) {
                nextBtn.disabled = true;
                nextBtn.classList.add('opacity-40', 'cursor-not-allowed');
            } else {
                nextBtn.disabled = false;
                nextBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            }

            indicator.textContent = `Soal ${currentIndex + 1} dari ${currentFilterList.length}`;
        }

        function prevQuestion() {
            const currentIndex = currentFilterList.findIndex(q => q.id === activeQuestionId);
            if (currentIndex > 0) {
                showQuestion(currentFilterList[currentIndex - 1].id);
            }
        }

        function nextQuestion() {
            const currentIndex = currentFilterList.findIndex(q => q.id === activeQuestionId);
            if (currentIndex < currentFilterList.length - 1) {
                showQuestion(currentFilterList[currentIndex + 1].id);
            }
        }

        // Check Individual Question Answer
        function checkAnswer(qId) {
            const q = quizData.find(item => item.id === qId);
            const inputEl = document.getElementById(`input-${qId}`);
            const feedbackEl = document.getElementById(`feedback-${qId}`);
            const rawVal = inputEl.value.trim();

            if (!rawVal) {
                feedbackEl.innerHTML = `<div class="mt-2 text-xs font-bold text-amber-600">⚠️ Isi jawabanmu terlebih dahulu sebelum memeriksa!</div>`;
                return;
            }

            const cleanVal = rawVal.toLowerCase().replace(/\s+/g, '');
            const isCorrect = q.answer.some(ans => ans.toLowerCase().replace(/\s+/g, '') === cleanVal);

            userAnswers[qId] = {
                text: rawVal,
                isCorrect: isCorrect
            };

            saveAnswers();
            renderNavGrid();
            updateScoreUI();

            if (isCorrect) {
                feedbackEl.innerHTML = `<div class="mt-3 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-bold text-emerald-700 flex items-center gap-2">🎉 Jawaban Kamu BENAR! Sangat Hebat!</div>`;
            } else {
                feedbackEl.innerHTML = `<div class="mt-3 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs font-bold text-rose-700 flex items-center gap-2">❌ Jawaban Belum Tepat. Coba periksa kembali ya!</div>`;
            }
        }

        // Category Filter Navigation
        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-700');
            });
            const activeBtn = document.getElementById(`btn-cat-${cat}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-100', 'text-slate-700');
                activeBtn.classList.add('bg-slate-900', 'text-white');
            }

            currentFilterList = cat === 'all' ? quizData : quizData.filter(q => q.cat === cat);
            activeQuestionId = currentFilterList[0].id;
            
            renderQuestions();
            renderNavGrid();
        }

        // Update Total Score UI
        function updateScoreUI() {
            let correctCount = 0;
            Object.keys(userAnswers).forEach(k => {
                if (userAnswers[k].isCorrect) correctCount++;
            });
            document.getElementById('total-score').textContent = correctCount;
        }

        // Reset Progress Confirmation
        function resetAllProgress() {
            if (confirm("Apakah kamu yakin ingin mereset semua jawaban kuis? Progress jawaban kamu akan dihapus.")) {
                userAnswers = {};
                localStorage.removeItem(STORAGE_KEY);
                renderQuestions();
                renderNavGrid();
            }
        }

        // Initialize on load
        window.onload = function() {
            loadAnswers();
            currentFilterList = quizData;
            renderQuestions();
            renderNavGrid();
        };
    </script>
</body>
</html>
